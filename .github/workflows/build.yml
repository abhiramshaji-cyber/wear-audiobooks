name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # The same key every build, so `adb install -r` never hits a signature mismatch —
      # a mismatch would force an uninstall, which wipes every saved listening position.
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/books.jks"
          cat > keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/books.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=books
          keyPassword=$KEYSTORE_PASSWORD
          EOF

      - run: ./gradlew assembleRelease --no-daemon

      - name: Check the APK is signed
        run: |
          "$ANDROID_HOME"/build-tools/34.0.0/apksigner verify --print-certs \
            app/build/outputs/apk/release/app-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: books-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk books.apk
          gh release upload "${GITHUB_REF_NAME}" books.apk --clobber
